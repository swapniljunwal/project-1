name: Docker CI/CD (No Compose)

on:
    push:
        branches:
        - main
        - develop_app
        - ci
        - cd
        - Docker_Deplyment
        - docker_cicd
        - dockerhub
        - image_version
        - deploy_2
    workflow_dispatch:

env:
    DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    IMAGE_TAG: ${{ github.run_number }}

jobs:

# ─────────────────────────────────────────────
    build:
        name: Build Docker Images
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Build Backend
                run: |
                    docker build -t $DOCKER_USERNAME/backend:$IMAGE_TAG ./backend

            -   name: Build Frontend
                run: |
                    docker build -t $DOCKER_USERNAME/frontend:$IMAGE_TAG ./frontend


# ─────────────────────────────────────────────
