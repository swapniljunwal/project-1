name: Docker CI/CD

on:
    push:
        branches:
            - main
            - develop_app
            - ci
            - cd
            - Docker_Deplyment
            - docker_cicd
            - dockerhub
            - image version

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout code
            uses: actions/checkout@v3

        # 🔐 Login to Docker Hub
        -   name: Login to Docker Hub
            run: |
                echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

        # 🐳 Build backend image with version
        -   name: Build Backend
            run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }} ./backend

        # 🐳 Build frontend image with version
        -   name: Build Frontend
            run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }} ./frontend

        # 🚀 Push images
        -   name: Push Backend
            run: docker push ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

        -   name: Push Frontend
            run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

        # 🚀 Deploy on EC2
        -   name: Deploy via SSH
            uses: appleboy/ssh-action@v1.0.0
            with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                    cd /home/ubuntu/project-1

                    # ✅ Step 4: define TAG
                    export TAG=${{ github.sha }}

                    sudo docker compose down

                    # ✅ Step 2: use TAG
                    sudo docker pull ${{ secrets.DOCKER_USERNAME }}/backend:$TAG
                    sudo docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:$TAG

                    sudo docker compose up -d